name: Institutional Trading Bot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # P1-9 (audit §2.8) : le CI teste les MÊMES versions que la prod.
    # - Python 3.11 aligné sur le Dockerfile (python:3.11-slim) — avant :
    #   CI sur 3.13, prod sur 3.11 (les tests ne prouvaient rien pour la prod).
    # - requirements.lock (figé) + requirements-dev.txt — avant : requirements.txt
    #   (>= non figé), les tests ne garantissaient pas le comportement déployé.
    - name: Set up Python 3.11 (aligné sur le Dockerfile de prod)
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Dependencies (locked prod + dev)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.lock
        pip install -r requirements-dev.txt

    - name: Syntax Compilation Check
      run: |
        python -m compileall -q . -x 'node_modules|\\.git'

    - name: Lint (ruff) — audit B16-4
      # BLOQUANT depuis le nettoyage : ruff passe sur tout le repo
      # (config .ruff.toml réparée — W503 retiré ; F405/E402 ignorés
      # per-fichier pour les modules découpés au LOT 7).
      run: |
        ruff check .

    - name: Dependency vulnerability audit — P1-9 (audit §4.10)
      # BLOQUANT désormais : une CVE haute/critique fait échouer le build.
      # pip-audit >= 2.7 a retiré --fail-on : le script analyse la sortie JSON.
      # Vérifié au branchement : requirements.lock = 0 vulnérabilité haute/critique.
      run: |
        python scripts/check_vulnerabilities.py

    - name: Run Automated Unit Tests (+ API smoke tests)
      run: |
        python -m pytest tests/ -q

    - name: Core coverage thresholds — P1-15 (audit §5)
      # Seuils par fichier sur le cœur qui touche l'argent :
      # main.py >= 30%, strategies/engine.py >= 80%, core/risk_pipeline.py >= 95%.
      run: |
        python scripts/check_coverage.py

    - name: Production Safety Check Script
      run: |
        python automated_production_safety_check.py || echo "Safety check reported findings (see logs)."

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Build Docker Image — audit B15-5
      run: |
        docker build -t quant-portal:ci .

    - name: Smoke test the image
      run: |
        docker run -d --name qp -p 8080:8080 -e PORT=8080 quant-portal:ci
        sleep 20
        docker exec qp python -c "import urllib.request; print('image /api/status:', urllib.request.urlopen('http://localhost:8080/api/status', timeout=5).status)"
        docker rm -f qp
