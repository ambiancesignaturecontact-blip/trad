# Audit B16-4: lint configuration
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "UP"]
# NB : l'ancienne règle pycodestyle des retours-lignes sur opérateur binaire
# a été retirée de ruff : la garder dans ignore faisait échouer ruff.
ignore = ["E501", "E203"]

[lint.per-file-ignores]
# main.py : imports après load_dotenv() (volontaire, ordre des secrets)
"main.py" = ["E402"]
# Modules extraits au LOT 7 (étape 1 du découpage) : ils accèdent aux
# symboles de main via `from main import *` (F405) et s'importent en fin de
# main.py (E402). Pattern documenté — à éliminer à l'étape 2 du découpage.
"api/routes.py" = ["E402", "F405"]
"schedulers.py" = ["E402", "F405"]
"telemetry.py" = ["E402", "F405"]
# database/db_manager.py : imports après le chargement d'environnement
"database/db_manager.py" = ["E402"]
