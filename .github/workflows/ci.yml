name: Institutional Trading Bot CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Syntax Compilation Check
      run: |
        python -m compileall -q . -x 'node_modules|\.git'

    - name: Run Automated Unit Tests (+ API smoke tests)
      run: |
        python -m pytest tests/ -q

    - name: Production Safety Check Script
      run: |
        python automated_production_safety_check.py || echo "Safety check reported findings (see logs)."
