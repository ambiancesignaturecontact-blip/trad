# Configuration Institutionnelle - Trading Bot
trading:
  min_notional_usd_micro: 3.0      # Pour capital < 200$
  min_notional_usd_small: 5.0      # Pour capital 200-1000$
  min_notional_usd_normal: 10.0    # Pour capital > 1000$
  signal_threshold: 0.08           # Seuil de signal pour trader (abaissé)
  loop_sleep_seconds: 2.5

risk:
  # ===== LOT 2 : SOURCE UNIQUE DE VÉRITÉ DU RR (Pilier F) =====
  reward_risk_ratio: 1.8           # RR utilisé PARTOUT : sizing Kelly + SL/TP + backtest
  min_reward_risk: 1.5             # RR minimal pour entrer (filtre d'entrée)
  min_reward_risk_high_vol: 2.0    # RR exigé en forte volatilité (régime 1/3)
  high_vol_return_std: 0.02        # seuil d'écart-type récent pour "forte vol"
  round_trip_cost_pct: 0.002       # coût aller-retour estimé (frais+slippage)
  kelly_fraction: 0.15             # fraction prudente du Kelly
  stop_loss_pct: 0.03              # stop % (TP = SL × reward_risk_ratio)
  atr_mult_sl: 2.0                 # stop ATR (TP = SL × reward_risk_ratio)
  # ===== Machine à états NORMAL/CAUTION/HALT (Pilier G) =====
  halt_cooldown_minutes: 15.0      # cool-down avant redémarrage après HALT
  # ===== Plafonds existants =====
  max_exposure_micro: 0.85         # 85% max pour micro-capital
  # P1-14 (audit §2.7) : exposition TOTALE max 75% (vs 25% PAR ACTIF) —
  # 3-4 positions simultanées possibles sans épuiser le budget total.
  max_exposure_normal: 0.75
  daily_drawdown_micro: 0.18
  daily_drawdown_normal: 0.025
  max_per_asset_pct: 0.25          # plafond dur 25% du capital sur un actif
  # P0-4 (audit §2.1) : plancher anti-empilement de la réduction cumulative
  # des overlays. LOT A (F1) : 0.25 — signaux calibrés, risque porté par
  # Kelly/CVaR/drawdowns (les blocages durs à 0 restent intégraux).
  final_scale_floor: 0.25
  # ===== P1-8 (audit §3) : drawdowns par taille de compte (RiskManager) =====
  daily_drawdown_small: 0.10       # capital 1 000 - 100 000 $ (10% quotidien)
  max_total_drawdown_micro: 0.35   # 35% lifetime pour micro-comptes
  max_total_drawdown_small: 0.20   # 20% lifetime comptes moyens
  max_total_drawdown_normal: 0.08  # 8% lifetime institutionnel
  kelly_multiplier_default: 0.15   # Kelly fractionnel par défaut (RiskManager)
  # ===== LOT B (F2) : autonomie stratégique =====
  # Auto-adaptation BORNÉE des paramètres de risque (Kelly, plafond par
  # actif, drawdowns) au régime HMM. Le facteur ne dépasse JAMAIS 1.25x
  # (ni ne descend sous 0.60x) la config de base ; les drawdowns ne sont
  # jamais élargis (uniquement resserrés en régime défensif). DÉMO == RÉAL.
  autonomy_enabled: true
  autonomy_aggressiveness: {0: 1.10, 1: 0.75, 2: 1.00, 3: 0.85}
  autonomy_factor_min: 0.60
  autonomy_factor_max: 1.25
  autonomy_ema_alpha: 0.30
  autonomy_confidence_min: 0.30
  autonomy_confidence_full: 0.80
  autonomy_kelly_min: 0.05
  autonomy_kelly_max: 0.25
  autonomy_max_per_asset_min: 0.10
  autonomy_max_per_asset_max: 0.30
  autonomy_daily_drawdown_floor: 0.015
  autonomy_total_drawdown_floor: 0.05

# ===== P1-8 (audit §3) : allocation de portefeuille (PortfolioAllocator) =====
portfolio:
  cash_reserve_pct: 0.15           # réserve de cash minimale (jamais 100% investi)
  target_vol_annual: 0.10          # volatilité cible annualisée du portefeuille
  rebalance_hours: 24.0            # rebalancing quotidien
  max_participation_pct: 0.01      # 1% du volume 24h (capacité / impact de marché)
  redundant_corr: 0.85             # corrélation = stratégies redondantes

# ===== P1-8 (audit §3) : risque de contrepartie =====
counterparty:
  max_capital_per_exchange_pct: 0.40   # jamais > 40% du capital sur 1 exchange
  alert_spread_bps: 25.0               # spread > 25 bps = marché perturbé
  alert_volume_drop_pct: 0.30          # volume < 30% de la normale = liquidité fuyante

# ===== P1-8 (audit §3) : comptabilité des coûts =====
costs:
  default_fee_rate: 0.001          # 0.1% taker
  default_slippage_bps: 5.0        # 5 bps moyen

# ===== P1-8 (audit §3) : order flow (fenêtres + seuils de toxicité) =====
orderflow:
  delta_window_seconds: 60.0       # delta agressif sur 60s
  cascade_window_seconds: 30.0     # fenêtre de détection de cascade
  absorption_window_seconds: 30.0  # fenêtre d'absorption
  toxic_delta_ratio: 0.35          # |delta|/volume > 35% = flux dominant
  min_toxic_volume_usd: 100000.0   # volume min (60s) pour juger la toxicité
  cascade_min_events: 3            # >= 3 liquidations -> cascade
  cascade_min_notional_usd: 200000.0  # >= $200k liquidations -> cascade
  absorption_volume_usd: 300000.0  # >= $300k volume sans mouvement -> absorption

# ===== P1-8 (audit §3) : vol targeting (overlay) =====
vol_targeting:
  target_tick_vol: 0.0004          # vol cible par tick (0.04%)
  realized_window: 40              # fenêtre de vol réalisée (ticks)
  min_scale: 0.25                  # réduction minimale autorisée
  max_scale: 2.0                   # amplification maximale autorisée

# ===== LOT D (F4) : détection de drift par PSI (online learning) =====
# PSI (Population Stability Index) entre la distribution de RÉFÉRENCE
# (fenêtre longue) et la distribution RÉCENTE des features clés (returns,
# vol, volume, momentum — cohérentes avec le feature store). Seuils
# standards : < 0.10 stable, 0.10-0.25 modéré, > 0.25 sévère. En drift
# sévère, l'oubli du bandit Thompson est accéléré (decay plus fort) pour
# ne plus récompenser un edge mort.
drift:
  psi_n_bins: 10                   # nb de bins du PSI
  psi_stable_threshold: 0.30        # seuils MARCHÉ (le crédit 0.10/0.25 -> SEVERE permanent)
  psi_severe_threshold: 0.60
  psi_window_reference: 2000       # fenêtre longue ~3 mois (barres 1h)
  psi_window_recent: 400           # fenêtre récente ~17 jours (barres 1h)
  bandit_decay_stable: 0.98        # nominal (demi-vie ~34 MAJ)
  bandit_decay_drift: 0.92         # drift sévère (demi-vie ~8 MAJ)
  bandit_decay_min: 0.85           # borne dure (jamais d'oubli total)
  bandit_decay_max: 0.995
  psi_interval_seconds: 900.0      # recalcul dans la boucle live (15 min)
  cusum_hold_seconds: 3600.0        # durée du flag CUSUM actif dans la fusion (1h)

# ===== P1-8 (audit §3) : exécution =====
execution:
  cvar_limit_pct: 0.025            # limite CVaR quotidienne (2.5%)

autopilot:
  # P0-6 (audit §5-P0-6) : 4-8 semaines de paper-trading DATÉ et CONTINU avant REAL
  min_paper_validation_days: 28
  paper_validation_required: true

data:
  use_real_data_only: true         # Toujours utiliser données réelles
  yahoo_fallback: true
  bybit_fallback: true
  divergence_threshold_pct: 1.00   # seuil de divergence multi-sources (défaut)

# ===== LOT 2 (mandat) : Conviction Engine =====
conviction:
  high_conviction_threshold: 0.25      # >= 0.25 = HIGH_CONVICTION
  low_conviction_threshold: 0.15       # [0.08, 0.15) = LOW_CONVICTION
  execution_risk_slippage_bps: 50.0    # slippage > 50 bps = exécution risquée
  uncalibrated_signal_max: 0.12        # signal faible SANS historique = non calibré
  low_regime_confidence: 0.35          # confiance régime < 0.35 -> x0.95

# ===== LOT 4 (mandat) : Edge Decay Engine =====
edge_decay:
  min_samples: 10               # pas de jugement sous 10 trades clôturés
  ema_alpha: 0.20
  warn_expectancy: -0.001       # expectancy EMA < -0.1% -> WARNING
  disable_expectancy: -0.003    # < -0.3% -> DISABLED (sous-pondéré, jamais arrêté)
  recover_expectancy: 0.0005    # > +0.05% -> RECOVERY (poids progressif)
  scale_disabled: 0.30          # bornes du scale : JAMAIS 0 (pas de suppression dure)
  scale_warning: 0.60
  scale_degraded: 0.85
  scale_recovery: 0.85
  history_maxlen: 200

strategies:
  all_enabled: true
  enable_stat_arb: true
  enable_inter_exchange_arb: true
  enable_scalping: true
  # ===== P1-12 (audit §2.2/§2.6) : bandit Thompson non-stationnaire =====
  bandit_decay: 0.98                # oubli exponentiel (demi-vie ~34 mises à jour)
  bandit_sample_refresh_seconds: 60.0  # tirage figé par cycle de décision (plus par tick)
  # ===== P1-11 (audit §2.5) : attribution PnL par Sharpe déflaté =====
  pnl_min_samples_full: 20          # échantillon minimal pour ajustement complet
  pnl_max_adjustment: 0.20          # borne d'ajustement (±20%) sous le plancher

logging:
  level: INFO
  structured: false

# ===== P2-multi-devise : devise de base du compte =====
# Toutes les valeurs affichées (balance, équité, PnL) sont converties dans
# cette devise via des taux RÉELS (open.er-api.com). L'interne reste en USD.
# Valeurs possibles : USD (défaut), EUR, GBP, JPY, CHF, AUD, CAD, CNY
account:
  currency: USD
