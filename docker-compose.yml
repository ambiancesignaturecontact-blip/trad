version: '3.8'

services:
  trading-bot:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
      # Add your secrets here or via .env
      # - SUPABASE_DB_URL=your_url
      # - SECRET_KEY_PATH=/app/secret.key
    volumes:
      - ./trading_platform.db:/app/trading_platform.db
      - ./secret.key:/app/secret.key
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Redis for future caching / rate limiting
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped